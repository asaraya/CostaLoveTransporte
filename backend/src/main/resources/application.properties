spring.application.name=costa-love-transporte
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:aeropost_inventario}?allowPublicKeyRetrieval=true&serverTimezone=America/Costa_Rica&rewriteBatchedStatements=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false
spring.cache.type=none
spring.data.redis.repositories.enabled=false
spring.jackson.time-zone=America/Costa_Rica
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.mvc.async.request-timeout=180000
server.tomcat.connection-timeout=200000
server.tomcat.max-swallow-size=256MB
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://costalovetransporte-production.up.railway.app,https://cargofsr-production.up.railway.app}
